<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherius GCS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #161616;
      color: #f4f4f4;
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.16px;
      color: #c6c6c6;
    }

    .bar-track {
      width: 160px;
      height: 2px;
      background: #393939;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 40%;
      background: #4589ff;
      animation: slide 1.2s cubic-bezier(0.2, 0, 0.38, 0.9) infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(500%); }
    }
  </style>
</head>
<body>
  <span class="name">Aetherius GCS</span>
  <div class="bar-track">
    <div class="bar-fill"></div>
  </div>
</body>
</html>
