name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm < 10.9 mis-validates platform-specific optionalDependencies on
      # Windows, so `npm ci` reports lock-file packages as "missing" even
      # though `npm install` resolved them correctly. Node 22's bundled npm
      # hits this; upgrading before `npm ci` avoids it without touching the
      # Node version.
      - run: npm install -g npm@11

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aetherius GCS ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
