# Field ids here are also the query parameters the app's Report a bug dialog
# fills in (src/lib/feedback/feedback.ts) — rename one in both places.
name: Bug report
description: Something in Aetherius GCS didn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, as specifically as you can. Error messages help a lot.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, so it can be made to happen again.
      placeholder: |
        1. Connect to the vehicle over USB
        2. Open Setup › Frame
        3. ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in automatically when reporting from the app (Help › Report a bug). Otherwise, the app version (Help › About), your OS, and the vehicle's firmware.
      render: text
